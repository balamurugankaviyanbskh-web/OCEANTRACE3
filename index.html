<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#EAF3FB;--card:#fff;--ink:#0B1F3A;--mute:#5B6B80;--line:#DCE4EE;--blue:#087EBC;--lb:#EAF6FC;--red:#D93636;--redbg:#FDECEC;--amber:#B7791F;--green:#1E9E6A;--sea:#A9CBE0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1626;--card:#0F2036;--ink:#E8F0F8;--mute:#8FA3B8;--line:#213650;--lb:#0E2D45;--redbg:#3A1A1F;--sea:#0E3A5C}}
:root[data-theme="dark"]{--bg:#0A1626;--card:#0F2036;--ink:#E8F0F8;--mute:#8FA3B8;--line:#213650;--lb:#0E2D45;--redbg:#3A1A1F;--sea:#0E3A5C}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);height:100%}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#F7FBFF 0%,var(--bg) 260px) fixed,var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.mp{font-family:Manrope,Inter,sans-serif;margin:0;letter-spacing:-.01em}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:1000;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:24px;height:60px}
.logo{display:flex;gap:10px;align-items:center;font-family:Manrope;font-weight:800;letter-spacing:.06em}
.logo small{display:block;font:500 10px Inter;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.logo i{width:32px;height:32px;border-radius:8px;background:var(--ink);display:grid;place-items:center;color:#fff}
nav{display:flex;gap:4px;margin-left:12px}nav a{padding:8px 14px;border-radius:8px;color:var(--mute);font-weight:500;cursor:pointer}nav a.on{background:var(--lb);color:var(--blue)}
.sys{margin-left:auto;font:600 11px Inter;letter-spacing:.08em;color:var(--green);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}.dot.r{background:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(11,31,58,.05)}
.pad{padding:18px}.lbl{font:600 10.5px Inter;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.btn{display:inline-flex;gap:8px;align-items:center;padding:11px 18px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 12px Inter;letter-spacing:.06em;cursor:pointer;text-transform:uppercase}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.d{background:var(--ink);border-color:var(--ink);color:#fff}
.hero{padding:44px 0 26px;display:grid;grid-template-columns:1.25fr 1fr;gap:32px;align-items:center}
.hero h1{font-size:clamp(30px,4.4vw,54px);line-height:1.04;font-weight:800}.hero h1 span{color:var(--blue)}
.hero p{color:var(--mute);max-width:560px;font-size:15.5px;margin:16px 0 22px}
.tag{display:inline-block;font:600 11px Inter;letter-spacing:.08em;color:var(--blue);background:var(--lb);padding:5px 10px;border-radius:99px;margin-bottom:14px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 18px}
.flow b{display:flex;gap:7px;align-items:center;padding:8px 12px;border:1px solid var(--line);background:var(--card);border-radius:9px;font:600 11px Inter;letter-spacing:.07em;color:var(--ink)}
.flow b svg{color:var(--blue)}.flow u{color:var(--mute);text-decoration:none}
.status{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.status div{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}.status b{font:600 11px Inter;letter-spacing:.08em;color:var(--green)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{padding:16px 18px;position:relative}.kpi .v{font:800 34px Manrope;margin-top:4px}.kpi .v small{font:500 13px Inter;color:var(--mute)}.kpi.red .v{color:var(--red)}
.kpi em{position:absolute;right:14px;top:14px;color:var(--blue);opacity:.8}
